name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-signal:
    name: Deploy Signal Service (Instance A)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and Build Client
        run: |
          npm ci
          cd client && npm ci && npm run build

      - name: Compress Source Code
        run: zip -r deploy.zip . -x "**/node_modules/*" -x ".git/*" -x ".github/*"

      - name: Transfer to Main Server (Instance A)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy.zip"
          target: "/tmp/mediasoup-deploy"

      - name: Execute Remote SSH Commands (Instance A)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            DEPLOY_DIR="/home/ubuntu/mediasoup-server"
            mkdir -p $DEPLOY_DIR
            unzip -o /tmp/mediasoup-deploy/deploy.zip -d $DEPLOY_DIR
            rm /tmp/mediasoup-deploy/deploy.zip
            cd $DEPLOY_DIR
            npm install
            cd signal-service && npm install && cd ..
            sudo setcap 'cap_net_bind_service=+ep' $(which node)
            pm2 start ecosystem.config.js --only signal-service --env production
            pm2 save

  deploy-ivr:
    name: Deploy IVR Service (Instance B)
    runs-on: ubuntu-latest
    needs: deploy-signal
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compress Source Code
        run: zip -r deploy.zip . -x "**/node_modules/*" -x ".git/*" -x ".github/*"

      - name: Transfer to IVR Server (Instance B)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.IVR_SERVER_HOST }}
          username: ${{ secrets.IVR_SERVER_USERNAME }}
          key: ${{ secrets.IVR_SERVER_SSH_KEY }}
          source: "deploy.zip"
          target: "/tmp/mediasoup-deploy"

      - name: Execute Remote SSH Commands (Instance B)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.IVR_SERVER_HOST }}
          username: ${{ secrets.IVR_SERVER_USERNAME }}
          key: ${{ secrets.IVR_SERVER_SSH_KEY }}
          script: |
            DEPLOY_DIR="/home/ubuntu/mediasoup-server"
            mkdir -p $DEPLOY_DIR
            unzip -o /tmp/mediasoup-deploy/deploy.zip -d $DEPLOY_DIR
            rm /tmp/mediasoup-deploy/deploy.zip
            cd $DEPLOY_DIR
            npm install
            cd ivr-service && npm install && cd ..
            pm2 start ecosystem.config.js --only ivr-service --env production
            pm2 save
